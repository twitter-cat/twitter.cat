<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>live / twitter.cat</title>

    <meta charset="UTF-8" />

    <meta property="og:type" content="image" />
    <link rel="icon" type="image/x-icon" href="/assets/svgs/face.svg" />

    <meta itemprop="name" content="twitter (dot) cat" />
    <meta name="description" content="small tools for twitter" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="twitter (dot) cat" />
    <meta name="twitter:site" content="@cvsilly_" />
    <meta name="twitter:description" content="small tools for twitter" />
    <meta
      name="twitter:image"
      content="https://twitter.cat/assets/images/bouncing.gif"
    />

    <style>
      html {
        scrollbar-width: thin;
        scrollbar-color: hsla(255 0 255 / 15%) #14171a;
        overflow-x: hidden;
      }

      body {
        padding-top: 64px;
        margin: 0;
        background-color: #14171a;
        color: white;

        font-family: "chirp", sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        flex-direction: column;
        color-scheme: dark;
        max-width: 100vw;
        overflow-x: hidden;
      }
      header {
        height: 64px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        /* background-color: #14171a; */
        background: linear-gradient(
          180deg,
          rgba(20, 23, 26, 1) 0%,
          rgba(20, 23, 26, 0) 100%
        );

        padding-left: 1rem;
        padding-right: 1rem;
        display: flex;
        align-items: center;

        .logo {
          display: block;
          width: fit-content;
          text-decoration: none;
          transition: opacity 0.2s, transform 0.1s;
        }

        .logo:hover {
          opacity: 0.8;
        }

        .logo:active {
          transform: scale(0.95);
        }

        .logo img {
          width: 34px;
        }
      }
      main {
        padding-top: 1.5rem;
        padding-bottom: 1.5rem;
        padding-left: 1rem;
        padding-right: 1rem;
        max-width: 928px;
        width: 100%;
        display: block;
        margin-left: auto;
        margin-right: auto;
      }

      .stats {
        display: flex;
        gap: 4rem;
        margin-bottom: 3rem;

        div {
          display: flex;
          flex-direction: column;
          gap: 0.25rem;

          span {
            color: #9c9da0;
            letter-spacing: 0.025em;
            text-transform: uppercase;
            font-size: 0.75rem;
            line-height: 1rem;
          }

          p {
            font-size: 2.25rem;
            line-height: 2.5rem;
            margin: 0px;
            font-weight: 700;
            font-family: "IBM Plex Mono", monospace;
          }
        }
      }

      h1 {
        font-size: 1.5rem;
        line-height: 2rem;
        color: #9e9e9e;
        font-weight: 400;
        margin-bottom: 1.5rem;

        b {
          color: white;
          font-weight: 500;
        }
      }

      .skeleton {
        display: inline-block;

        background: linear-gradient(
          90deg,
          rgba(158, 158, 158, 0.08) 0%,
          rgba(158, 158, 158, 0.14) 20%,
          rgba(158, 158, 158, 0.08) 40%
        );
        background-size: 200% 100%;
        border-radius: 4px;
        pointer-events: none;
        margin-bottom: -7px;
        animation: skeleton-shimmer 1.4s infinite linear;
      }

      @keyframes skeleton-shimmer {
        0% {
          background-position: -200% 0;
        }

        100% {
          background-position: 200% 0;
        }
      }

      .tweets-table {
        max-width: calc(100vw - 2rem);
        overflow-x: auto;
        display: block;
        width: 100%;
        border-collapse: collapse;
        margin-top: 1em;
      }

      .tweets-table th {
        text-align: left;
        font-weight: 700;
        font-size: 13px;
        color: #9c9da0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding-bottom: 7px;
      }

      .tweets-table th.stat-col {
        text-align: center;
        width: 80px;
      }

      .tweets-table td {
        padding: 12px;
        vertical-align: top;
        padding-left: 0px;
        padding-right: 0px;
        cursor: pointer;
      }

      .author-cell {
        width: 185px;
        min-width: 185px;
      }

      .author-cell a {
        display: flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }

      .tweet-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }

      .tweet-name {
        color: white;
        font-weight: 500;
        font-size: 15px;
        display: block;
      }

      .content-cell {
        color: #e7e9ea;
        font-size: 15px;
        line-height: 20px;
        word-wrap: break-word;
        max-width: 500px;
      }

      .content-cell .media-preview {
        margin-top: 8px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #2f3336;
      }

      .content-cell .media-preview img {
        width: 100%;
        max-width: 300px;
        height: auto;
        display: block;
      }

      .time-cell {
        color: #9e9e9e;
        font-size: 15px;
        white-space: nowrap;
        text-align: right;
        font-weight: 500;
      }

      .time-cell a {
        color: #9e9e9e;
        text-decoration: none;
      }

      .time-cell a:hover {
        color: white;
      }

      br,
      svg,
      img[draggable="false"],
      .white,
      .word {
        user-select: none;
        pointer-events: none;
      }

      @font-face {
        font-family: "chirp";
        src: url("../assets/fonts/chirp.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: "chirp";
        src: url("../assets/fonts/chirpmedium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }

      @font-face {
        font-family: "chirp";
        src: url("../assets/fonts/chirpbold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }

      @font-face {
        font-family: "chirp";
        src: url("../assets/fonts/chirpheavy.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
      }

      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../assets/fonts/ibm-plex-mono.woff2") format("woff2");
      }

      @media (max-width: 600px) {
        .stats {
          flex-direction: column;
          gap: 1.5rem;
        }

        .author-cell {
          width: 140px;
          min-width: 140px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="logo" draggable="false">
        <img src="assets/svgs/kitty.svg" draggable="false" />
      </a>
    </header>
    <main>
      <div class="stats">
        <div class="count tweets">
          <span>Total Tweets</span>
          <p>
            <span class="skeleton" style="width: 194px; height: 40px"></span>
          </p>
        </div>

        <div class="count accounts">
          <span>Total Accounts</span>
          <p>
            <span class="skeleton" style="width: 194px; height: 40px"></span>
          </p>
        </div>
      </div>

      <h1>
        <b><span class="skeleton" style="width: 80px; height: 29px"></span></b>
        tweets crawled in the last hour
      </h1>

      <table class="tweets-table">
        <thead>
          <tr>
            <th>Author</th>
            <th>Content</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </body>
  <script>
    let isLoadingMore = false;
    let oldestTimestamp = null;
    let loadedTweetIds = new Set();
    let isAutoRefreshing = true;

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function getTimeAgo(dateString) {
      const date = new Date(dateString);
      const now = new Date();

      const seconds = Math.floor((now - date) / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (seconds < 60) {
        return `${seconds}s`;
      } else if (minutes < 60) {
        return `${minutes}m`;
      } else if (hours < 24) {
        return `${hours}h`;
      }

      return `${days}d`;
    }

    function attachTweetClickHandlers() {
      document.querySelectorAll("[data-tweet-id]:not([data-click-attached])").forEach((cell) => {
        cell.setAttribute("data-click-attached", "true");
        cell.addEventListener("click", (e) => {
          if (e.target.tagName === 'A') return;
          e.preventDefault();
          e.stopPropagation();
          const id = cell.getAttribute("data-tweet-id");
          window.open(`https://x.com/i/status/${id}`, "_blank");
        });
      });
    }

    const getTweetsHTML = (tweets) => {
      setTimeout(attachTweetClickHandlers, 10);
      
      return tweets
        .map((tweet) => {
          const safeName = escapeHtml(tweet.name);
          const safeUsername = escapeHtml(tweet.username);
          const safeBody = escapeHtml(tweet.body);
          const safeAvatar = escapeHtml(tweet.avatar);

          let mediaHtml = "";
          if (tweet.media && tweet.media !== "[]") {
            try {
              const mediaArray = JSON.parse(tweet.media);
              if (mediaArray && mediaArray.length > 0 && mediaArray[0].url) {
                const mediaUrl = escapeHtml(mediaArray[0].url);
                mediaHtml = `<div class="media-preview"><img src="${mediaUrl}" alt="Media" /></div>`;
              }
            } catch (e) {
              console.log("Error parsing media:", e);
            }
          }

          const indexedAgo = getTimeAgo(tweet.added_at);

          return `
              <tr data-tweet-id="${tweet.id}" data-added-at="${tweet.added_at}">
                <td>
                  <div class="author-cell">
                  <a href="https://x.com/i/user/${
                    tweet.author_id
                  }" target="_blank" rel="noopener noreferrer">
                    <img src="${safeAvatar}" class="tweet-avatar" alt="Avatar" onerror="this.src = 'https://upload.wikimedia.org/wikipedia/commons/0/03/Twitter_default_profile_400x400.png'" />
                    <span class="tweet-name">${
                      safeName || `@${safeUsername}`
                    }</span>
                  </a>
                  </div>
                </td>
                <td class="content-cell">${safeBody}${mediaHtml}</td>
                <td class="time-cell"><a href="https://x.com/i/status/${
                  tweet.id
                }" target="_blank" rel="noopener noreferrer" data-time="${
            tweet.added_at
          }">${indexedAgo}</a></td>
              </tr>
            `;
        })
        .join("");
    };

    (async () => {
      const API_URL =
        window.API_URL ||
        (await import("./js/config.js").then(({ API_URL }) => API_URL));

      // Load stats
      fetch(`${API_URL}/stats`)
        .then((res) => res.json())
        .then(([accounts, tweets]) => {
          document.querySelector(".count.tweets p").innerText =
            Number(tweets).toLocaleString();
          document.querySelector(".count.accounts p").innerText =
            Number(accounts).toLocaleString();
        });

      // Load last hour stats
      fetch(`${API_URL}/live/lh`)
        .then((res) => res.json())
        .then((data) => {
          document.querySelector("h1").innerHTML = `<b>${Number(
            data.lastHour
          ).toLocaleString()}</b> tweets crawled in the last hour`;
        });

      // Load initial tweets
      const initialResponse = await fetch(`${API_URL}/live/tweets`);
      const { tweets: initialTweets, hash: lastHash } = await initialResponse.json();
      
      // Track loaded tweets
      initialTweets.forEach(tweet => loadedTweetIds.add(tweet.id));
      
      // Set oldest timestamp for pagination
      if (initialTweets.length > 0) {
        oldestTimestamp = initialTweets[initialTweets.length - 1].added_at;
      }
      
      const tbody = document.querySelector(".tweets-table tbody");
      tbody.innerHTML = getTweetsHTML(initialTweets);

      // Update time ago every 5 seconds
      setInterval(() => {
        document.querySelectorAll("[data-time]").forEach((cell) => {
          const time = cell.getAttribute("data-time");
          cell.textContent = getTimeAgo(time);
        });
      }, 5000);

      // Auto-refresh for new tweets every 3 seconds
      let currentHash = lastHash;
      setInterval(async () => {
        if (!isAutoRefreshing) return;
        
        try {
          const response = await fetch(`${API_URL}/live/tweets?hash=${currentHash}`);
          const data = await response.json();
          
          // Update hash
          if (data.hash) {
            currentHash = data.hash;
          }
          
          // If there are new tweets, replace the top portion
          if (data.tweets && data.tweets.length > 0) {
            const newTweets = data.tweets.filter(tweet => !loadedTweetIds.has(tweet.id));
            
            if (newTweets.length > 0) {
              // Add new tweet IDs to tracking
              newTweets.forEach(tweet => loadedTweetIds.add(tweet.id));
              
              // Prepend new tweets to the table
              const tbody = document.querySelector(".tweets-table tbody");
              tbody.insertAdjacentHTML('afterbegin', getTweetsHTML(newTweets));
              
              // Keep only the most recent 200 tweets in view
              const allRows = tbody.querySelectorAll('tr');
              if (allRows.length > 200) {
                for (let i = 200; i < allRows.length; i++) {
                  const removedId = allRows[i].getAttribute('data-tweet-id');
                  if (removedId) loadedTweetIds.delete(removedId);
                  allRows[i].remove();
                }
              }
            }
          }
        } catch (error) {
          console.error("Error fetching new tweets:", error);
        }
      }, 3000);

      // Infinite scroll function
      async function loadMoreTweets() {
        if (isLoadingMore || !oldestTimestamp) {
          return;
        }

        isLoadingMore = true;

        try {
          const response = await fetch(`${API_URL}/live/tweets?cursor=${oldestTimestamp}`);
          const { tweets } = await response.json();

          if (!tweets || tweets.length === 0) {
            const sentinelEl = document.querySelector(".load-sentinel");
            if (sentinelEl) {
              sentinelEl.remove();
            }
            return;
          }

          // Filter out duplicates
          const newTweets = tweets.filter(tweet => !loadedTweetIds.has(tweet.id));
          
          if (newTweets.length > 0) {
            // Track new tweets
            newTweets.forEach(tweet => loadedTweetIds.add(tweet.id));
            
            // Update oldest timestamp
            oldestTimestamp = newTweets[newTweets.length - 1].added_at;

            // Append to table
            const tbody = document.querySelector(".tweets-table tbody");
            tbody.insertAdjacentHTML('beforeend', getTweetsHTML(newTweets));
          } else if (tweets.length > 0) {
            // All tweets were duplicates, update cursor and try again
            oldestTimestamp = tweets[tweets.length - 1].added_at;
          }
        } catch (error) {
          console.error("Error loading more tweets:", error);
        } finally {
          isLoadingMore = false;
        }
      }

      // Create loading sentinel for infinite scroll
      const sentinel = document.createElement("div");
      sentinel.className = "load-sentinel";
      sentinel.innerHTML = `
      <div style="text-align: center; margin-top: 2em">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <style>
            .spinner_ajPY {
              transform-origin: center;
              animation: spinner_AtaB 0.5s infinite linear;
            }
            @keyframes spinner_AtaB {
              100% {
                transform: rotate(360deg);
              }
            }
          </style>
          <path
            d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z"
            opacity=".25"
            fill="#1EA1F1"
          />
          <path
            d="M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z"
            fill="#1EA1F1"
            class="spinner_ajPY"
          />
        </svg>
      </div>`;
      document.querySelector("main").appendChild(sentinel);

      // Set up intersection observer for infinite scroll
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting && !isLoadingMore) {
              loadMoreTweets();
            }
          });
        },
        { rootMargin: "500px" }
      );

      observer.observe(sentinel);
    })();
  </script>
</html>
