<!doctype html>
<html lang="en">
  <head>
    <title>
      twitter.cat — the open-source real-time twitter search engine & tools
    </title>

    <meta charset="UTF-8" />

    <meta property="og:type" content="image" />
    <link rel="icon" type="image/x-icon" href="/assets/svgs/face.svg" />

    <meta itemprop="name" content="twitter.cat" />
    <meta
      name="description"
      content="search and analyze a real-time scrape of millions of tweets updated every second with twitter.cat"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="twitter.cat" />
    <meta name="twitter:site" content="@cvsilly_" />
    <meta
      name="twitter:description"
      content="search and analyze a real-time scrape of millions of tweets updated every second with twitter.cat"
    />
    <meta
      name="twitter:image"
      content="https://twitter.cat/assets/images/bouncing.gif"
    />

    <link rel="preload" as="font" href="/assets/fonts/chirp.woff2" />
    <link rel="preload" as="font" href="/assets/fonts/chirpmedium.woff2" />
    <link rel="preload" as="font" href="/assets/fonts/chirpbold.woff2" />
    <link rel="preload" as="font" href="/assets/fonts/chirpheavy.woff2" />
    <link rel="preload" as="script" href="/js/index.js" />
    <link rel="preload" as="script" href="/js/config.js" />
    <link rel="preload" as="script" href="/js/session.js" />
    <link rel="preload" as="script" href="/js/stats.js" />

    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/search.css" />
    <link rel="stylesheet" href="/css/skeleton.css" />
    <link rel="stylesheet" href="/css/filters.css" />
    <link rel="stylesheet" href="/css/typeahead.css" />

    <!-- <link rel="stylesheet" href="/css/youretooearly.css" /> -->
  </head>
  <body>
    <style>
      .notice {
        position: absolute;
        top: 15px;
        left: 0px;
        right: 0px;
        font-size: 15px;
        user-select: none;
      }

      .notice p {
        max-width: 390px;
        margin: 0px auto;
        line-height: 1.4;
        text-align: center;
        color: #9fa5aa;
        opacity: 0.9;

        a {
          color: #dadfe4;
          text-decoration: underline;
          text-underline-offset: 3px;
        }
      }

      .notice button {
        background: transparent;
        border: none;
        aspect-ratio: 1 / 1;
        cursor: pointer;
        right: 17px;
        position: absolute;
        top: 5px;
        color: #c6ccd1;
      }

      .notice button:hover {
        color: white;
      }

      html:has(.center .results) .notice {
        display: none !important;
      }
    </style>
    <div class="notice" style="display: none">
      <p>
        search is currently being synced, so results are temporarily using a
        smaller dataset.
        <a href="https://x.com/twittdotcat" target="_blank">more updates</a>
      </p>

      <button
        title="close"
        onclick="
          this.parentElement.remove();
          localStorage.setItem('syctwbanner', 'h');
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-x"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M18 6l-12 12" />
          <path d="M6 6l12 12" />
        </svg>
      </button>
    </div>
    <script>
      if (localStorage.getItem("syctwbanner") !== "h") {
        document.querySelector(".notice").style.display = "flex";
      }
    </script>
    <div class="center-wrapper">
      <div class="center">
        <div class="logo" role="banner">
          <img src="assets/svgs/kitty.svg" draggable="false" alt="kitty !!" />

          <!-- prettier-ignore -->
          <div>
          <a class="dark">@</a><a class="heavy">twitter.cat</a>
        </div>
        </div>

        <div class="search" role="main">
          <img
            src="assets/svgs/search.svg"
            class="searchicon"
            draggable="false"
            alt="search icon"
          />
          <input
            class="searchbar"
            placeholder="search"
            autofocus
            autocorrect="off"
          />
        </div>

        <!-- these aren't linked as normal files because i can't get them to recolor otherwise 😭 god dammit -->
        <div class="buttons">
          <button class="toggle" data-toggle="tweets">
            <span class="svgwrapper">
              <span class="togglebg tweetsbg"></span>

              <svg
                class="buttonicon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366a8.13 8.13 0 0 1 8.129 8.13c0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067A8.005 8.005 0 0 1 1.751 10m8.005-6a6.005 6.005 0 1 0 .133 12.01l.351-.01h1.761v2.3l5.087-2.81A6.127 6.127 0 0 0 14.122 4z"
                />
              </svg>
            </span>
            <span>tweets</span>
          </button>
          <button class="toggle" data-toggle="accounts">
            <span class="svgwrapper">
              <span class="togglebg accountsbg"></span>
              <svg
                class="buttonicon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M5.651 19h12.698c-.337-1.8-1.023-3.21-1.945-4.19C15.318 13.65 13.838 13 12 13s-3.317.65-4.404 1.81c-.922.98-1.608 2.39-1.945 4.19m.486-5.56C7.627 11.85 9.648 11 12 11s4.373.85 5.863 2.44c1.477 1.58 2.366 3.8 2.632 6.46l.11 1.1H3.395l.11-1.1c.266-2.66 1.155-4.88 2.632-6.46M12 4c-1.105 0-2 .9-2 2s.895 2 2 2 2-.9 2-2-.895-2-2-2M8 6a4 4 0 1 1 8 0 4 4 0 0 1-8 0"
                />
              </svg>
            </span>
            <span>accounts</span>
          </button>
          <button class="toggle" data-toggle="media">
            <span class="svgwrapper">
              <span class="togglebg mediabg"></span>
              <svg
                class="buttonicon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13zM19 15.414l-3-3-5 5-3-3-3 3V18.5c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-3.086zM9.75 7C8.784 7 8 7.784 8 8.75s.784 1.75 1.75 1.75 1.75-.784 1.75-1.75S10.716 7 9.75 7z"
                />
              </svg>
            </span>
            <span>media</span>
          </button>

          <button class="toggle" data-toggle="lists">
            <span class="svgwrapper">
              <span class="togglebg listsbg"></span>
              <svg

                viewBox="0 0 24 24"
              >
                <path
                  d="M3 4.5A2.5 2.5 0 0 1 5.5 2h13A2.5 2.5 0 0 1 21 4.5v15a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 19.5zM5.5 4c-.28 0-.5.22-.5.5v15c0 .28.22.5.5.5h13c.28 0 .5-.22.5-.5v-15c0-.28-.22-.5-.5-.5zM16 10H8V8h8zm-8 2h8v2H8z"
                />
              </svg>
            </span>
            <span>lists</span>
          </button>

            </span>
            <span>ads</span>

          <div class="sort-dropdown" id="sort-dropdown">
            <button class="sort-toggle" id="sort-toggle" title="Sort results">
              <span class="sort-label">Relevance</span>
              <svg
                class="dropdown-arrow"
                viewBox="0 0 24 24"
                width="16"
                height="16"
              >
                <path d="M7 10l5 5 5-5z" fill="currentColor" />
              </svg>
            </button>
            <div class="sort-menu" id="sort-menu">
              <button class="sort-option active" data-sort="relevance">
                Relevance
              </button>
              <button class="sort-option" data-sort="likes">Likes</button>
              <button class="sort-option" data-sort="newest">Newest</button>
              <button class="sort-option" data-sort="oldest">Oldest</button>
            </div>
          </div>

          <button
            class="filter-toggle"
            id="filter-toggle"
            title="Advanced filters"
          >
            <span class="svgwrapper">
              <span class="togglebg filterbg"></span>

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="buttonicon"
                aria-hidden="true"
                style="width: 14px; height: 14px"
              >
                <path
                  d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"
                ></path>
              </svg>
            </span>
          </button>
        </div>

        <div class="filters-panel" id="filters-panel">
          <div class="filters-content">
            <div class="filter-section">
              <textarea
                id="filter-textarea"
                class="filter-textarea"
                placeholder="e.g., followers >= 1000 AND verified = true"
                rows="8"
                spellcheck="false"
                maxlength="600"
              ></textarea>
              <p class="filter-help">
                <a
                  href="https://www.meilisearch.com/docs/reference/api/search#filter"
                  target="_blank"
                  rel="noopener"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-circle-question-mark-icon lucide-circle-question-mark"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                    <path d="M12 17h.01" />
                  </svg>
                  learn filter syntax →
                </a>
              </p>
            </div>
          </div>
        </div>

        <div class="counter">
          <a href="/live">
            <div class="count tweets">
              <span>tweets</span>
              <p></p>
            </div>
          </a>

          <a href="/live">
            <div class="count accounts">
              <span>accounts</span>
              <p></p>
            </div>
          </a>
        </div>
      </div>
    </div>

    <div class="bottom dark" role="navigation">
      <a href="https://x.twitter.cat">fxembed</a>
      <a href="/legal">legal</a>
      <a
        title="This service is independently operated and is not affiliated with, endorsed by, or sponsored by any company formerly or currently known as Twitter, X, X Corp, or any related entity. Use at your own risk."
      >
        not affiliated with 𝕏
      </a>
    </div>

  <script src="/js/stats.js" defer></script>
  <script
    defer
    data-domain="twitter.cat"
    src="https://a.tiago.zip/js/script.js"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@cap.js/widget@0.1.32"

  ></script>
