    <link rel="preload" as="script" href="/js/index.js" />
    <link rel="preload" as="script" href="/js/config.js" />
    <link rel="preload" as="script" href="/js/session.js" />
    <link rel="preload" as="script" href="/js/stats.js" />

    <link rel="stylesheet" href="/css/index.css" />

    <div class="center-wrapper">
      <div class="center">
        <div class="logo" role="banner">
          <img src="assets/svgs/kitty.svg" draggable="false" alt="kitty !!" />

          <!-- prettier-ignore -->
          <div>
          <a class="dark">@</a><a class="heavy">twitter.cat</a>
        </div>
        </div>

        <div class="search" role="main">
          <input
            class="searchbar"
            placeholder="search"
            autofocus
            autocorrect="off"
          />
        </div>

        <!-- these aren't linked as normal files because i can't get them to recolor otherwise 😭 god dammit -->
        <div class="buttons">
          <button class="toggle" data-toggle="tweets">
            tweets
          </button>
          <button class="toggle" data-toggle="accounts">
            accounts
          </button>
          <button class="toggle" data-toggle="media">
            media
          </button>

          <div class="sort-dropdown" id="sort-dropdown">
            <button class="sort-toggle" id="sort-toggle" title="Sort results">
              <span class="sort-label">relevance</span>
              <svg
                class="dropdown-arrow"
                viewBox="0 0 24 24"
                width="16"
                height="16"
              >
                <path d="M7 10l5 5 5-5z" fill="currentColor" />
              </svg>
            </button>
            <div class="sort-menu" id="sort-menu">
              <button class="sort-option active" data-sort="relevance">
                relevance
              </button>
              <button class="sort-option" data-sort="likes">likes</button>
              <button class="sort-option" data-sort="newest">newest</button>
              <button class="sort-option" data-sort="oldest">oldest</button>
            </div>
          </div>

          <button
            class="filter-toggle"
            id="filter-toggle"
            title="Advanced filters"
          >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="buttonicon"
                aria-hidden="true"
                style="width: 14px; height: 14px"
              >
                <path
                  d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"
                ></path>
              </svg>
          </button>
        </div>

        <div class="filters-panel" id="filters-panel">
          <div class="filters-content">
            <div id="filter-editor"></div>
            <div class="filter-hint">
              fields, operators (>=, !=, ...), AND, OR, NOT, parentheses • <a href="/pages/filters.html">syntax</a>
            </div>
          </div>
        </div>

        <div class="counter">
          <a href="/live">
            <div class="count tweets">
              <span>tweets</span>
              <p></p>
            </div>
          </a>

          <a href="/live">
            <div class="count accounts">
              <span>accounts</span>
              <p></p>
            </div>
          </a>
        </div>
      </div>
    </div>

    <div class="bottom dark" role="navigation">
      <a href="https://x.twitter.cat">fxembed</a>

  <script src="/js/index.js" type="module" defer></script>
  <script src="/js/typeahead.js" type="module" defer></script>
  <script src="/js/stats.js" defer></script>

    defer
    data-domain="twitter.cat"
    src="https://a.tiago.zip/js/script.js"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@cap.js/widget@0.1.41"
    async
  ></script>
