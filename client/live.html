<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html {
        scrollbar-width: thin;
        scrollbar-color: hsla(255 0 255 / 15%) #14171a;
        overflow-x: hidden;
        color-scheme: dark;
      }

      body {
        padding-top: 64px;
        margin: 0;
        background-color: #14171a;
        color: white;

        font-family: "chirp", sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        flex-direction: column;
        color-scheme: dark;
        max-width: 100vw;
        overflow-x: hidden;
      }
      header {
        height: 64px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: linear-gradient(180deg, rgba(20, 23, 26, 1) 0%, rgba(20, 23, 26, 0) 100%);

        padding-left: 1rem;
        padding-right: 1rem;
        display: flex;
        align-items: center;

        .logo {
          display: block;
          width: fit-content;
          text-decoration: none;
          transition:
            opacity 0.2s,
            transform 0.1s;
        }

        .logo:hover {
          opacity: 0.8;
        }

        .logo:active {
          transform: scale(0.95);
        }

        .logo img {
          width: 34px;
        }
      }
      main {
        padding-top: 1.5rem;
        padding-bottom: 1.5rem;
        padding-left: 1rem;
        padding-right: 1rem;
        max-width: 928px;
        width: 100%;
        display: block;
        margin-left: auto;
        margin-right: auto;
      }

      .stats {
        display: flex;
        gap: 4rem;
        margin-bottom: 3rem;

        div {
          display: flex;
          flex-direction: column;
          gap: 0.25rem;

          span {
            color: #9c9da0;
            letter-spacing: 0.025em;
            text-transform: uppercase;
            font-size: 0.75rem;
            line-height: 1rem;
            user-select: none;
          }

          p {
            font-size: 2.25rem;
            line-height: 2.5rem;
            margin: 0px;
            font-weight: 700;
            font-family: "IBM Plex Mono", monospace;
          }
        }
      }

      h1 {
        font-size: 1.5rem;
        line-height: 2rem;
        color: #9e9e9e;
        font-weight: 400;
        margin-bottom: 1.5rem;
        user-select: none;

        b {
          color: white;
          font-weight: 500;
        }
      }

      .skeleton {
        display: inline-block;

        background: linear-gradient(
          90deg,
          rgba(158, 158, 158, 0.08) 0%,
          rgba(158, 158, 158, 0.14) 20%,
          rgba(158, 158, 158, 0.08) 40%
        );
        background-size: 200% 100%;
        border-radius: 4px;
        pointer-events: none;
        margin-bottom: -7px;
        animation: skeleton-shimmer 1.4s infinite linear;
      }

      @keyframes skeleton-shimmer {
        0% {
          background-position: -200% 0;
        }

        100% {
          background-position: 200% 0;
        }
      }

      .tweets-table {
        max-width: calc(100vw - 2rem);
        overflow-x: auto;
        display: block;
        width: 100%;
        border-collapse: collapse;
        margin-top: 1em;
      }

      .tweets-table th {
        text-align: left;
        font-weight: 700;
        font-size: 13px;
        color: #9c9da0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding-bottom: 7px;
        user-select: none;
      }

      .tweets-table th.stat-col {
        text-align: center;
        width: 80px;
      }

      .tweets-table td {
        padding: 12px;
        vertical-align: top;
        padding-left: 0px;
        padding-right: 0px;
        cursor: pointer;
        animation: fade-in 0.1s ease-in-out;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .author-cell {
        width: 185px;
        min-width: 185px;
      }

      .author-cell a {
        display: flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }

      .tweet-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        user-select: none;
      }

      .tweet-name {
        color: white;
        font-weight: 500;
        font-size: 15px;
        display: block;
      }

      .content-cell {
        color: #e7e9ea;
        font-size: 15px;
        line-height: 20px;
        word-wrap: break-word;
        max-width: 500px;
      }

      .content-cell .media {
        display: block;
        margin-top: 4px;
        color: #9e9e9e;
        font-size: 13px;
        font-weight: 500;

        img,
        video {
          width: 18px;
          height: 18px;
          vertical-align: middle;
          margin-left: 4px;
          border-radius: 2px;
          object-fit: cover;
        }
      }

      .time-cell {
        color: #9e9e9e;
        font-size: 15px;
        white-space: nowrap;
        text-align: right;
        font-weight: 500;
        user-select: none;
      }

      .time-cell a {
        color: #9e9e9e;
        text-decoration: none;
      }

      .time-cell a:hover {
        color: white;
      }

      br,
      svg,
      img[draggable="false"],
      .white,
      .word {
        user-select: none;
        pointer-events: none;
      }

      @font-face {
        font-family: "chirp";
        src: url("../assets/fonts/chirp.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: "chirp";
        src: url("../assets/fonts/chirpmedium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }

      @font-face {
        font-family: "chirp";
        src: url("../assets/fonts/chirpbold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }

      @font-face {
        font-family: "chirp";
        src: url("../assets/fonts/chirpheavy.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
      }

      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../assets/fonts/ibm-plex-mono.woff2") format("woff2");
      }

      @media (max-width: 600px) {
        .stats {
          flex-direction: column;
          gap: 1.5rem;
        }

        .author-cell {
          width: 140px;
          min-width: 140px;
        }
      }

      .querying-text {
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        display: inline-block;
        background-image: linear-gradient(
          90deg,
          #919698a6 0%,
          #919698a6 20%,
          #c8cacc 40%,
          #919698a6 60%,
          #919698a6 100%
        );
        background-size: 200% 100%;
        pointer-events: none;
        animation: skeleton-loading 1.4s infinite linear;
        font-family: "chirp", sans-serif;
        text-align: left;
        font-size: 15px;
        margin: 0px;
        margin-top: -6px;
      }
      @keyframes skeleton-loading {
        0% {
          background-position: 200% 0;
        }

        100% {
          background-position: -200% 0;
        }
      }
    </style>

    <script defer data-domain="twitter.cat" src="https://palantir.estrogen.delivery/Pn7xQk2.js"></script>

  <body>
    <header>
      <a href="/" class="logo" draggable="false">
        <img src="assets/svgs/kitty.svg" draggable="false" />
      </a>
    </header>
    <main>
      <div class="stats">
        <div class="count tweets">
          <span>Total Tweets</span>
          <p>
            <span class="skeleton" style="width: 216px; height: 40px"></span>
          </p>
        </div>

        <div class="count accounts">
          <span>Total Accounts</span>
          <p>
            <span class="skeleton" style="width: 194px; height: 40px"></span>
          </p>
        </div>
      </div>

      <h1>
        <b><span class="skeleton" style="width: 93px; height: 29px"></span></b>
        tweets crawled in the last hour
      </h1>

      <table class="tweets-table">
        <thead>
          <tr>
            <th>Author</th>
            <th>Content</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <div class="author-cell">
                <p class="querying-text">Querying index...</p>
              </div>
            </td>
            <td class="content-cell"></td>
            <td class="time-cell"></td>
          </tr>
        </tbody>
      </table>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@cap.js/widget@0.1.41" async></script>
  </body>
  <script>
    const SESSION_STORAGE_KEY = "twittercat_session";
    const SESSION_REFRESH_BUFFER_MS = 5 * 60 * 1000;
    const MAX_SEARCHES = 20;

    let sessionPromise = null;
    let currentSession = null;

    function getStoredSession() {
      try {
        const stored = localStorage.getItem(SESSION_STORAGE_KEY);
        if (!stored) return null;

        const session = JSON.parse(stored);
        if (!session.token || !session.expires) return null;

        if (Date.now() >= session.expires - SESSION_REFRESH_BUFFER_MS) {
          localStorage.removeItem(SESSION_STORAGE_KEY);
          return null;
        }

        if (typeof session.searchCount !== "number") session.searchCount = 0;

        if (session.searchCount >= MAX_SEARCHES) {
          localStorage.removeItem(SESSION_STORAGE_KEY);
          return null;
        }

        return session;
      } catch {
        localStorage.removeItem(SESSION_STORAGE_KEY);
        return null;
      }
    }

    function storeSession(session) {
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
      currentSession = session;
    }

    function showInterstitial() {
      let interstitial = document.querySelector(".cap-loading-indicator");
      if (interstitial) return interstitial;

      interstitial = document.createElement("div");
      interstitial.className = "cap-loading-indicator";
      interstitial.style.cssText =
        "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;";

      const container = document.createElement("div");
      container.style.cssText = "text-align:center;color:white;font-family:system-ui,sans-serif;";

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", "32");
      svg.setAttribute("height", "32");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "white");

      const style = document.createElement("style");
      style.textContent = `.spinner_6kVp{transform-origin:center;animation:spinner_irSm .75s infinite linear}@keyframes spinner_irSm{100%{transform:rotate(360deg)}}`;
      svg.appendChild(style);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute(
        "d",
        "M10.72,19.9a8,8,0,0,1-6.5-9.79A7.77,7.77,0,0,1,10.4,4.16a8,8,0,0,1,9.49,6.52A1.54,1.54,0,0,0,21.38,12h.13a1.37,1.37,0,0,0,1.38-1.54,11,11,0,1,0-12.7,12.39A1.54,1.54,0,0,0,12,21.34h0A1.47,1.47,0,0,0,10.72,19.9Z",
      );
      path.setAttribute("class", "spinner_6kVp");
      svg.appendChild(path);

      const p1 = document.createElement("p");
      p1.style.cssText = "margin-top:16px;font-size:18px;";
      p1.textContent = "making sure you're not a bot!";

      const p2 = document.createElement("p");
      p2.style.cssText = "margin-top:8px;font-size:14px;opacity:0.7;";
      p2.textContent = "please wait a moment while we ensure the security of your connection.";

      container.appendChild(svg);
      container.appendChild(p1);
      container.appendChild(p2);
      interstitial.appendChild(container);
      document.body.appendChild(interstitial);

      return interstitial;
    }

    function hideInterstitial() {
      const interstitial = document.querySelector(".cap-loading-indicator");
      if (interstitial) {
        interstitial.remove();
      }
    }

    async function createNewSession(apiUrl, showUI = true) {
      if (showUI) {
        showInterstitial();
      }

      try {
        const cap = new window.Cap({
          apiEndpoint: `https://cap.tiago.zip/c18a824a18/`,
        });

        const { token: capToken } = await cap.solve();

        const response = await fetch(`${apiUrl}/cap/session`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ capToken }),
        });

        const result = await response.json();

        if (!result.success || !result.sessionToken) {
          throw new Error(result.error || "Failed to create session");
        }

        const session = {
          token: result.sessionToken,
          expires: result.expires,
          searchCount: 0,
        };

        storeSession(session);

        return session;
      } finally {
        if (showUI) {
          hideInterstitial();
        }
      }
    }

    async function ensureSession(apiUrl) {
      if (currentSession && Date.now() < currentSession.expires - SESSION_REFRESH_BUFFER_MS) {
        return currentSession.token;
      }

      const stored = getStoredSession();
      if (stored) {
        currentSession = stored;
        return stored.token;
      }

      if (sessionPromise) {
        showInterstitial();
        try {
          const session = await sessionPromise;
          if (session) {
            return session.token;
          }
        } finally {
          hideInterstitial();
        }
      }

      sessionPromise = createNewSession(apiUrl, true);
      try {
        const session = await sessionPromise;
        return session.token;
      } finally {
        sessionPromise = null;
      }
    }

    function startSessionCreation(apiUrl) {
      const stored = getStoredSession();
      if (stored) {
        currentSession = stored;
        return;
      }

      if (!sessionPromise) {
        sessionPromise = createNewSession(apiUrl, false)
          .catch(() => {
            return null;
          })
          .finally(() => {
            sessionPromise = null;
          });
      }
    }

    let isLoadingMore = false;
    let nextCursor = null;
    const loadedTweetIds = new Set();
    const isAutoRefreshing = true;

    function getTimeAgo(dateString) {
      const date = new Date(dateString);
      const now = new Date();

      const seconds = Math.floor((now - date) / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (seconds < 0) {
        return "1s";
      }

      if (seconds < 60) {
        return `${seconds}s`;
      } else if (minutes < 60) {
        return `${minutes}m`;
      } else if (hours < 24) {
        return `${hours}h`;
      }

      return `${days}d`;
    }

    function createTweetElement(tweet) {
      const tr = document.createElement("tr");
      tr.setAttribute("data-tweet-id", tweet.id);
      tr.setAttribute("data-added-at", tweet.added_at);

      tr.addEventListener("click", (e) => {
        if (e.target.tagName === "A") return;
        e.preventDefault();
        e.stopPropagation();
        window.open(`https://x.com/i/status/${tweet.id}`, "_blank");
      });

      const authorTd = document.createElement("td");
      const authorDiv = document.createElement("div");
      authorDiv.className = "author-cell";

      const authorLink = document.createElement("a");
      authorLink.href = `https://x.com/i/user/${tweet.author_id}`;
      authorLink.target = "_blank";
      authorLink.rel = "noopener noreferrer";

      const avatar = document.createElement("img");
      avatar.src = tweet.avatar;
      avatar.className = "tweet-avatar";
      avatar.alt = "Avatar";
      avatar.style.opacity = "0";
      avatar.style.transition = "opacity 0.35s";
      avatar.onload = () => {
        avatar.style.opacity = "1";
      };
      avatar.onerror = () => {
        avatar.src =
          "https://upload.wikimedia.org/wikipedia/commons/0/03/Twitter_default_profile_400x400.png";
      };

      const nameSpan = document.createElement("span");
      nameSpan.className = "tweet-name";
      nameSpan.textContent = tweet.name || `@${tweet.username}`;

      authorLink.appendChild(avatar);
      authorLink.appendChild(nameSpan);
      authorDiv.appendChild(authorLink);
      authorTd.appendChild(authorDiv);

      const contentTd = document.createElement("td");
      contentTd.className = "content-cell";
      contentTd.textContent = tweet.body;

      const mediaImages = tweet.media
        ? JSON.parse(tweet.media).filter((m) => m.type === "photo")
        : [];
      const mediaVideos = tweet.media
        ? JSON.parse(tweet.media).filter((m) => m.type === "video" || m.type === "animated_gif")
        : [];

      if (mediaImages.length || mediaVideos.length) {
        const mediaText = [
          mediaImages.length
            ? `${mediaImages.length} image${mediaImages.length === 1 ? "" : "s"}`
            : "",
          mediaVideos.length
            ? `${mediaVideos.length} video${mediaVideos.length === 1 ? "" : "s"}`
            : "",
        ]
          .filter(Boolean)
          .join(" and ");

        const mediaSmall = document.createElement("small");
        mediaSmall.className = "media";
        mediaSmall.innerHTML = `${mediaText} ${mediaImages
          .map(
            (m) =>
              `<img src="${m.url}" alt="media" loading="lazy" style="opacity:0;transition:opacity.3s"/>`,
          )
          .join("")} ${mediaVideos
          .map(
            (m) =>
              `<img src="${m.url}" alt="media" loading="lazy" style="opacity:0;transition:opacity.3s"/>`,
          )
          .join("")}`;
        contentTd.appendChild(mediaSmall);

        mediaSmall.querySelectorAll("img, video").forEach((img) => {
          img.onload = () => {
            img.style.opacity = "1";
          };
          img.onerror = () => {
            img.style.remove();
          };
        });
      }

      const timeTd = document.createElement("td");
      timeTd.className = "time-cell";

      const timeLink = document.createElement("a");
      timeLink.href = `https://x.com/i/status/${tweet.id}`;
      timeLink.target = "_blank";
      timeLink.rel = "noopener noreferrer";
      timeLink.setAttribute("data-time", tweet.added_at);
      timeLink.textContent = getTimeAgo(tweet.added_at);

      timeTd.appendChild(timeLink);

      tr.appendChild(authorTd);
      tr.appendChild(contentTd);
      tr.appendChild(timeTd);

      return tr;
    }

    (async () => {
      const API_URL =
        window.API_URL || (await import("./js/config.js").then(({ API_URL }) => API_URL));

      fetch(`${API_URL}/stats`)
        .then((res) => res.json())
        .then(([accounts, tweets]) => {
          document.querySelector(".count.tweets p").textContent = Number(tweets).toLocaleString();
          document.querySelector(".count.accounts p").textContent =
            Number(accounts).toLocaleString();
        });

      fetch(`${API_URL}/stats/hourly`)
        .then((res) => res.json())
        .then((data) => {
          const h1 = document.querySelector("h1");
          h1.textContent = "";
          const b = document.createElement("b");
          b.textContent = Number(data.lastHour).toLocaleString();
          h1.appendChild(b);
          h1.appendChild(document.createTextNode(" tweets crawled in the last hour"));
        });

      startSessionCreation(API_URL);

      const initialResponse = await fetch(`${API_URL}/stats/tweets`, {
        headers: {
          "x-twittercat-client":
            (() => {
              const c = document.createElement("canvas");
              c.width = 100;
              c.height = 100;

              const ctx = c.getContext("2d");
              const id = crypto.randomUUID();
              let h = 0;
              for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
              for (let y = 0; y < 100; y += 4) {
                ctx.fillStyle = `rgb(${(h + y * 3) % 255}, ${(h >> 2) % 255}, ${(h + y) % 255})`;
                ctx.fillRect(0, y, 100, 4);
              }
              ctx.font = "9px monospace";
              ctx.fillStyle = "#000";
              ctx.fillText(id.slice(0, 10), 2, 18);

              ctx.font = "7px Arial";
              ctx.fillStyle = "#222";
              ctx.fillText(id.slice(10, 20), 2, 32);
              ctx.save();
              ctx.translate(50, 60);
              ctx.rotate((h % 100) / 5000);
              ctx.scale(1, 1 + ((h >> 3) % 5) / 50);
              ctx.fillStyle = "#111";
              ctx.fillText(id.slice(20), -40, 0);
              ctx.restore();
              for (let i = 0; i < 40; i++) {
                const x = (h * (i + 3)) % 100;
                const y = (h * (i + 7)) % 100;
                ctx.fillStyle = `rgb(${(h >> i) & 255}, ${(h >> (i + 3)) & 255}, ${(h >> (i + 6)) & 255})`;
                ctx.fillRect(x, y, 1, 1);
              }
              ctx.beginPath();
              ctx.arc(75, 75, 4 + (h % 3), 0, Math.PI * (1.5 + (h % 10) / 20));
              ctx.strokeStyle = "#000";
              ctx.stroke();
              return c
                .toDataURL("image/jpeg", 0.6)
                .replace("data:image/jpeg;base64,/9j/", "")
                .replaceAll("=", "");
            })() +
            "?" +
            parseInt(
              `${new Date().getTime() * 12}${location.hostname.length + navigator.userAgent.length}`,
            ).toString(36) +
            new Date().getTime().toString(36) +
            Math.imul(0x123456, Date.now()).toString(36) +
            "?" +
            (navigator.hardwareConcurrency || 0) +
            "." +
            (navigator.deviceMemory || 0) +
            "." +
            navigator.userAgent.length.toString(36) +
            "." +
            btoa(navigator.languages.join("")).replaceAll("=", "") +
            "." +
            btoa(navigator.language || "").replaceAll("=", "") +
            "." +
            [
              screen.width.toString(36),
              screen.height.toString(36),
              screen.colorDepth.toString(36),
              window.innerWidth.toString(36),
              window.innerHeight.toString(36),
              ((window.devicePixelRatio * 1000) | 0).toString(36),
              document.body.getElementsByTagName("*").length.toString(36),
              (performance.timeOrigin + performance.now()).toString(36),
              ((Date.now() - performance.now()) | 0).toString(36),
              (() => {}).toString().length.toString(36),
              Math.max.toString().length.toString(36),
              btoa(
                Intl.DateTimeFormat().resolvedOptions().timeZone +
                  "-" +
                  new Intl.NumberFormat().format(12345.67).length,
              ).replaceAll("=", ""),
            ].join("§") +
            `?${crypto.randomUUID().split("-")[4]}31bd${crypto.randomUUID().split("-")[4]}`,
        },
      });
      const { tweets: initialTweets, hash: lastHash, cursor } = await initialResponse.json();

      await new Promise((resolve) => setTimeout(resolve, 1000));

      document.querySelector("tbody").innerHTML = "";

      initialTweets.forEach((tweet) => {
        loadedTweetIds.add(tweet.id);
      });

      nextCursor = cursor;

      const tbody = document.querySelector(".tweets-table tbody");
      const fragment = document.createDocumentFragment();
      initialTweets.forEach(async (tweet) => {
        fragment.appendChild(createTweetElement(tweet));
      });
      tbody.appendChild(fragment);

      setInterval(() => {
        document.querySelectorAll("[data-time]").forEach((cell) => {
          const time = cell.getAttribute("data-time");
          cell.textContent = getTimeAgo(time);
        });
      }, 3000);

      let eventSource = null;

      async function gunzip(input) {
        const u = Uint8Array.from(atob(input), (c) => c.charCodeAt(0));

        const ds = new DecompressionStream("gzip");
        const decompressedStream = new Response(u).body.pipeThrough(ds);

        const reader = decompressedStream.getReader();
        const chunks = [];
        let totalLength = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          totalLength += value.byteLength;
        }

        const ab = new Uint8Array(totalLength);
        let offset = 0;
        for (const chunk of chunks) {
          ab.set(chunk, offset);
          offset += chunk.byteLength;
        }

        return new TextDecoder().decode(ab);
      }

      async function connectSSE() {
        if (!isAutoRefreshing) return;

        const sessionToken = await ensureSession(API_URL);
        const url = new URL(`${API_URL}/stats/tweets/stream`);
        url.searchParams.set(
          "c",
          `${crypto.randomUUID().split("-")[4]}31bd${crypto.randomUUID().split("-")[4]}`,
        );
        url.searchParams.set(
          "client",
          parseInt(
            `${new Date().getTime() * 12}${location.hostname.length + navigator.userAgent.length}`,
          ).toString(36) +
            new Date().getTime().toString(36) +
            Math.imul(0x123456, Date.now()).toString(36) +
            "?" +
            (navigator.hardwareConcurrency || 0) +
            "." +
            (navigator.deviceMemory || 0) +
            "." +
            navigator.userAgent.length.toString(36) +
            "." +
            btoa(navigator.languages.join("")).replaceAll("=", "") +
            "." +
            btoa(navigator.language || "").replaceAll("=", "") +
            "." +
            [
              screen.width.toString(36),
              screen.height.toString(36),
              screen.colorDepth.toString(36),
              window.innerWidth.toString(36),
              window.innerHeight.toString(36),
              ((window.devicePixelRatio * 1000) | 0).toString(36),
              document.body.getElementsByTagName("*").length.toString(36),
              (performance.timeOrigin + performance.now()).toString(36),
              ((Date.now() - performance.now()) | 0).toString(36),
              (() => {}).toString().length.toString(36),
              Math.max.toString().length.toString(36),
              btoa(
                Intl.DateTimeFormat().resolvedOptions().timeZone +
                  "-" +
                  new Intl.NumberFormat().format(12345.67).length,
              ).replaceAll("=", ""),
            ].join("§") +
            `?${crypto.randomUUID().split("-")[4]}31bd${crypto.randomUUID().split("-")[4]}`,
        );
        url.searchParams.set("s", sessionToken);

        eventSource = new EventSource(url);

        eventSource.onmessage = async (event) => {
          if (!isAutoRefreshing) return;

          const data = JSON.parse(await gunzip(event.data));

          if (data.tweets && data.tweets.length > 0) {
            const newTweets = data.tweets.filter((tweet) => !loadedTweetIds.has(tweet.id));

            if (newTweets.length > 0) {
              newTweets.forEach((tweet) => {
                loadedTweetIds.add(tweet.id);
              });

              const tbody = document.querySelector(".tweets-table tbody");

              const scrollParent = tbody.closest(".tweets-container") || window;
              const isWindow = scrollParent === window;
              const scrollTop = isWindow ? window.scrollY : scrollParent.scrollTop;
              const shouldPreserveScroll = scrollTop > 2000;

              let scrollHeight;
              if (shouldPreserveScroll) {
                scrollHeight = isWindow
                  ? document.documentElement.scrollHeight
                  : scrollParent.scrollHeight;
              }

              const fragment = document.createDocumentFragment();
              newTweets.forEach((tweet) => {
                fragment.appendChild(createTweetElement(tweet));
              });
              tbody.insertBefore(fragment, tbody.firstChild);

              if (shouldPreserveScroll) {
                const newScrollHeight = isWindow
                  ? document.documentElement.scrollHeight
                  : scrollParent.scrollHeight;
                const heightDifference = newScrollHeight - scrollHeight;

                if (isWindow) {
                  window.scrollTo(0, scrollTop + heightDifference);
                } else {
                  scrollParent.scrollTop = scrollTop + heightDifference;
                }
              }

              const allRows = tbody.querySelectorAll("tr");
              if (allRows.length > 200) {
                for (let i = 200; i < allRows.length; i++) {
                  const removedId = allRows[i].getAttribute("data-tweet-id");
                  if (removedId) loadedTweetIds.delete(removedId);
                  allRows[i].remove();
                }
              }
            }
          }
        };

        eventSource.onerror = (error) => {
          console.error("sse connection error:", error);
          eventSource.close();

          setTimeout(() => {
            if (isAutoRefreshing) {
              connectSSE();
            }
          }, 5000);
        };
      }

      connectSSE();

      const originalAutoRefreshToggle = isAutoRefreshing;

      async function loadMoreTweets() {
        if (isLoadingMore || !nextCursor) {
          return;
        }

        isLoadingMore = true;

        const sessionToken = await ensureSession(API_URL);

        try {
          const response = await fetch(
            `${API_URL}/stats/tweets?cursor=${encodeURIComponent(nextCursor)}&session=${encodeURIComponent(
              sessionToken,
            )}`,
            {
              headers: {
                "x-twittercat-client":
                  (() => {
                    const c = document.createElement("canvas");
                    c.width = 100;
                    c.height = 100;

                    const ctx = c.getContext("2d");
                    const id = crypto.randomUUID();
                    let h = 0;
                    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
                    for (let y = 0; y < 100; y += 4) {
                      ctx.fillStyle = `rgb(${(h + y * 3) % 255}, ${(h >> 2) % 255}, ${(h + y) % 255})`;
                      ctx.fillRect(0, y, 100, 4);
                    }
                    ctx.font = "9px monospace";
                    ctx.fillStyle = "#000";
                    ctx.fillText(id.slice(0, 10), 2, 18);

                    ctx.font = "7px Arial";
                    ctx.fillStyle = "#222";
                    ctx.fillText(id.slice(10, 20), 2, 32);
                    ctx.save();
                    ctx.translate(50, 60);
                    ctx.rotate((h % 100) / 5000);
                    ctx.scale(1, 1 + ((h >> 3) % 5) / 50);
                    ctx.fillStyle = "#111";
                    ctx.fillText(id.slice(20), -40, 0);
                    ctx.restore();
                    for (let i = 0; i < 40; i++) {
                      const x = (h * (i + 3)) % 100;
                      const y = (h * (i + 7)) % 100;
                      ctx.fillStyle = `rgb(${(h >> i) & 255}, ${(h >> (i + 3)) & 255}, ${(h >> (i + 6)) & 255})`;
                      ctx.fillRect(x, y, 1, 1);
                    }
                    ctx.beginPath();
                    ctx.arc(75, 75, 4 + (h % 3), 0, Math.PI * (1.5 + (h % 10) / 20));
                    ctx.strokeStyle = "#000";
                    ctx.stroke();
                    return c
                      .toDataURL("image/jpeg", 0.6)
                      .replace("data:image/jpeg;base64,/9j/", "")
                      .replaceAll("=", "");
                  })() +
                  "?" +
                  parseInt(
                    `${new Date().getTime() * 12}${location.hostname.length + navigator.userAgent.length}`,
                  ).toString(36) +
                  new Date().getTime().toString(36) +
                  Math.imul(0x123456, Date.now()).toString(36) +
                  "?" +
                  (navigator.hardwareConcurrency || 0) +
                  "." +
                  (navigator.deviceMemory || 0) +
                  "." +
                  navigator.userAgent.length.toString(36) +
                  "." +
                  btoa(navigator.languages.join("")).replaceAll("=", "") +
                  "." +
                  btoa(navigator.language || "").replaceAll("=", "") +
                  "." +
                  [
                    screen.width.toString(36),
                    screen.height.toString(36),
                    screen.colorDepth.toString(36),
                    window.innerWidth.toString(36),
                    window.innerHeight.toString(36),
                    ((window.devicePixelRatio * 1000) | 0).toString(36),
                    document.body.getElementsByTagName("*").length.toString(36),
                    (performance.timeOrigin + performance.now()).toString(36),
                    ((Date.now() - performance.now()) | 0).toString(36),
                    (() => {}).toString().length.toString(36),
                    Math.max.toString().length.toString(36),
                    btoa(
                      Intl.DateTimeFormat().resolvedOptions().timeZone +
                        "-" +
                        new Intl.NumberFormat().format(12345.67).length,
                    ).replaceAll("=", ""),
                  ].join("§") +
                  `?${crypto.randomUUID().split("-")[4]}31bd${crypto.randomUUID().split("-")[4]}`,
              },
            },
          );
          const { tweets, cursor: newCursor, error } = await response.json();

          if (error) {
            console.error("failed to request more tweets", error);
            const sentinelEl = document.querySelector(".load-sentinel");
            if (sentinelEl) {
              sentinelEl.remove();
            }
            return;
          }

          if (!tweets || tweets.length === 0) {
            const sentinelEl = document.querySelector(".load-sentinel");
            if (sentinelEl) {
              sentinelEl.remove();
            }
            return;
          }

          const newTweets = tweets.filter((tweet) => !loadedTweetIds.has(tweet.id));

          if (newTweets.length > 0) {
            newTweets.forEach((tweet) => {
              loadedTweetIds.add(tweet.id);
            });

            const tbody = document.querySelector(".tweets-table tbody");
            const fragment = document.createDocumentFragment();
            newTweets.forEach(async (tweet) => {
              fragment.appendChild(createTweetElement(tweet));
            });
            tbody.appendChild(fragment);
          }

          nextCursor = newCursor;
        } catch (error) {
          console.error("error loading more tweets:", error);
        } finally {
          isLoadingMore = false;
        }
      }

      const sentinel = document.createElement("div");
      sentinel.className = "load-sentinel";
      sentinel.style.cssText = "text-align: center; margin-top: 2em";

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", "28");
      svg.setAttribute("height", "28");
      svg.setAttribute("viewBox", "0 0 24 24");

      const style = document.createElement("style");
      style.textContent = `.spinner_ajPY{transform-origin:center;animation:spinner_AtaB 0.5s infinite linear}@keyframes spinner_AtaB{100%{transform:rotate(360deg)}}`;
      svg.appendChild(style);

      const path1 = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path1.setAttribute(
        "d",
        "M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z",
      );
      path1.setAttribute("opacity", ".25");
      path1.setAttribute("fill", "#1EA1F1");

      const path2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path2.setAttribute(
        "d",
        "M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z",
      );
      path2.setAttribute("fill", "#1EA1F1");
      path2.setAttribute("class", "spinner_ajPY");

      svg.appendChild(path1);
      svg.appendChild(path2);
      sentinel.appendChild(svg);
      document.querySelector("main").appendChild(sentinel);

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting && !isLoadingMore) {
              loadMoreTweets();
            }
          });
        },
        { rootMargin: "500px" },
      );

      observer.observe(sentinel);
    })();
  </script>
